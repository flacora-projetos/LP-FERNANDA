         dobra começam escondidas para animar no scroll. Precisa rodar antes do
         primeiro paint, por isso fica inline e no topo do <head>.
         Rede de segurança: se o bundle não hidratar em 4s (falha de rede, erro
         de JS), a classe é removida e todo o conteúdo volta a aparecer. -->
    <script>
      document.documentElement.classList.add('js');
      setTimeout(function () {
        if (!document.documentElement.dataset.hydrated) {
          document.documentElement.classList.remove('js');
        }
      }, 4000);
    </script>
